name: Test Graph Dependencies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-graph:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test -f sql/schema.sql

      - name: Run graph query
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test -f sql/graph.sql
